<!DOCTYPE html>
<html>
<head>
    <title>Simple GPA Calculator</title>
    <meta charset="UTF-8">
    <meta name="keywords" content="GPA, calculator">
    <meta name="description" content="A simple GPA calculator based on letter grades and weightages">
    <meta name="author" content="Maneesh Gollapudi">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js"></script>
</head>
<body>
    <h1>Simple GPA Calculator</h1>
    <p>How to use: Enter in your letter grade, and mark if the course is weighted or unweighted.</p>
    <div class="form">
        <form>
            
            <div class="gradeRow">
                <div class="grade">Letter Grade</div>
                <div class="weight">Weighted?</div>
            </div>
            
            <div class="gradeRow">
                <div class="grade"><input type="text" id="grade1" name="grade1" size="5"></div>
                <div class="weight"><input type="checkbox" id="w1" name="w1"></div>
            </div>

            <div class="gradeRow">
                <div class="grade"><input type="text" id="grade2" name="grade2" size="5"></div>
                <div class="weight"><input type="checkbox" id="w2" name="w2"></div>
            </div>

            <div class="gradeRow">
                <div class="grade"><input type="text" id="grade3" name="grade3" size="5"></div>
                <div class="weight"><input type="checkbox" id="w3" name="w3"></div>
            </div>

            <div class="gradeRow">
                <div class="grade"><input type="text" id="grade4" name="grade4" size="5"></div>
                <div class="weight"><input type="checkbox" id="w4" name="w4"></div>
            </div>

            <div class="gradeRow">
                <div class="grade"><input type="text" id="grade5" name="grade5" size="5"></div>
                <div class="weight"><input type="checkbox" id="w5" name="w5"></div>
            </div>

            <div class="gradeRow">
                <div class="grade"><input type="text" id="grade6" name="grade6" size="5"></div>
                <div class="weight"><input type="checkbox" id="w6" name="w6"></div>
            </div>

            <div class="gradeRow">
                <div class="grade"><input type="text" id="grade7" name="grade7" size="5"></div>
                <div class="weight"><input type="checkbox" id="w7" name="w7">  </div>
            </div>

            <div class="gradeRow submit">
                <input type="submit">  
            </div>
        </form>
    </div>
</body>
</html>
